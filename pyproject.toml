[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patrickscript"
version = "1.3.0"
description = "A Turing-complete stack-based language with exactly two lexical tokens"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["esolang", "interpreter", "stack-machine", "patrickscript"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://github.com/prmichaelsen/patrick-script"
Repository = "https://github.com/prmichaelsen/patrick-script"

[project.scripts]
patrickscript = "patrickscript.ps:main"
patrickscript-asm = "patrickscript.psa:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patrickscript"]

[tool.hatch.build.targets.sdist]
include = [
  "src/patrickscript/",
  "README.md",
  "spec/patrickscript.md",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
